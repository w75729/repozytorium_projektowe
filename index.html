<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antykwariat Akgun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Antykwariat Akgun</h1>
        <p>Prosta aplikacja do zarzadzania lista ksiazek.</p>
    </header>

    <main>
        <section>
            <h2>Dodaj ksiazke</h2>
            <form id="book-form">
                <label for="title">Tytul</label>
                <input type="text" id="title" name="title">

                <label for="author">Autor</label>
                <input type="text" id="author" name="author">

                <label for="year">Rok wydania</label>
                <input type="number" id="year" name="year">

                <label for="genre">Gatunek</label>
                <input type="text" id="genre" name="genre">

                <label for="description">Opis</label>
                <textarea id="description" name="description" rows="4"></textarea>

                <button type="submit">Dodaj</button>
            </form>
        </section>

        <section>
            <h2>Wyszukaj ksiazke</h2>
            <input type="text" id="search" placeholder="Wpisz tytul lub autora">
        </section>

        <section>
            <h2>Lista ksiazek</h2>
            <div id="book-list">
                <p>Lista ksiazek pojawi sie tutaj.</p>
            </div>
        </section>

        <section>
            <h2>Szczegoly ksiazki</h2>
            <div id="book-details">
                <p>Wybierz ksiazke z listy, aby zobaczyc szczegoly.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Furkan Akgun | Numer indeksu: 75729 | 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
